[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beai"
version = "0.1.0"
description = "BEAI biochemical research platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.4",
    "alembic==1.20.0",
    "biopython==1.88",
    "Jinja2==3.1.6",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "biotite==1.6.0",
    "rdkit==2025.9.1",
    "meeko==0.8.0",
    "gemmi==0.7.5",
    "psutil==7.2.2",
    "scikit-learn==1.9.1",
    "openmm==8.6.1",
    "pdbfixer==1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.0",
]
# CPU wheels come from https://download.pytorch.org/whl/cpu. PyPI's default torch wheel is not this build.
models = [
    "torch==2.9.1+cpu",
    "transformers==5.19.0",
    "torch-geometric==2.8.1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.services.structure" = ["ccd/*.cif"]
"backend.app.services.reports" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q -m 'not network and not model'"
markers = [
    "network: live calls to public scientific APIs",
    "model: loads a real pretrained checkpoint",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends() and File() in argument defaults.
"backend/app/api/**/*.py" = ["B008"]
